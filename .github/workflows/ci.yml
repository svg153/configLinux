name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: 'SCRIPTS/bootstrap/*.sh'

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "Checking bash syntax..."
          errors=0
          for script in $(find . -name "*.sh" -not -path "./.git/*"); do
            if ! bash -n "$script" 2>/dev/null; then
              echo "FAIL: $script"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors scripts have syntax errors"
            exit 1
          fi
          echo "All bash scripts pass syntax check"

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check docs directory
        run: test -d docs && echo "docs/ directory exists"
