# The current version of the conf
version: 1
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: vi
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# Preference for editor-based interactive prompting. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prefer_editor_prompt: disabled
# A pager program to send command output to, e.g. "less". Set the value to "cat" to disable the pager.
pager: cat
# Aliases allow you to create nicknames for gh commands
# Examples:
#  * https://gist.github.com/vilmibm/a1b9a405ac0d5153c614c9c646e37d13
#  * https://github.com/vEnhance/dotfiles/blob/main/gh-config.yml
#  * https://github.com/aaronpowell/system-init/blob/master/common/gh-config.yml
#  * https://github.com/cli/cli/issues/1200#issuecomment-659921986
#  * https://campusvirtual.ull.es/ocw/pluginfile.php/19489/mod_resource/content/3/_site/pages/gh.html
aliases:
    aliases: alias list
    accounts: auth status
    rmarchive: "!(\n    # TODO: change the sed to support other github servers, change to regex uri pattern \n    repo_owner=$(git remote get-url origin | sed -n 's/.*github.com[:\\/]\\(.*\\)\\/.*/\\1/p')\n    owner=${1:-$repo_owner}\n    gh api --paginate graphql -f owner=\"${owner}\" -f query='\n        query($owner: String!, $per_page: Int = 100, $endCursor: String) {\n            repositoryOwner(login: $owner) {\n                repositories(first: $per_page, after: $endCursor, isArchived: true) {\n                    nodes { name }\n                    pageInfo { hasNextPage endCursor }\n                }\n            }\n        }' \\\n    | jq -r '.data.repositoryOwner.repositories.nodes[].name' | sort \\\n    | fzf --multi \\\n    | xargs -I '%' gh repo delete ${owner}/% --yes\n)"
    web: |-
        !(
            if [ $# -eq 0 ]; then
                gh repo view --web
            else
                gh repo view --web $1
            fi
        )
    wi: |-
        !(
            if [ $# -eq 0 ]; then
                gh wif
            else
                work_item_id=$1
                gh plain-wi ${work_item_id}
            fi
        )
    wif: |-
        !(
            gh wif-simple
        )
    wif-simple: |-
        !(
            gh azdo-wif-simple
        )
    wif-prev: |-
        !(
            gh azdo-wif-simple-prev
        )
    prs: |-
        !(
            GH_FORCE_TTY='50%' \
            gh pr list \
                | fzf \
                    --ansi --header-lines 3 \
                    --preview 'GH_FORCE_TTY=$FZF_PREVIEW_COLUMNS gh pr view {1}; GH_FORCE_TTY=$FZF_PREVIEW_COLUMNS gh pr checks {1}' \
                | awk '{print $1}'
        )
    open: pr view
    prv: pr view
    sw: |-
        !(
            [ $# -eq 0 ] && git switch main
            [ $# -eq 1 ] && git switch $1
            if [ $# -eq 2 ] && [ $1 = '-c' ] && [ -n $2 ]; then
                git switch -c $2
            fi
        )
    co: |-
        !(
            # list all the PRs and all the issues in the repository (that not have PR linked) and checkout
            all_issues_without_pr_linked=$(gh issue list --json number,title,body | jq -r '.[] | "\(.number) \(.title) \(.body)"')
            all_prs=$(gh pr list --json number,title,headRefName,baseRefName,author,createdAt,updatedAt,body | jq -r '.[] | "\(.number) \(.title) \(.headRefName) \(.baseRefName) \(.author.login) \(.createdAt) \(.updatedAt) \(.body)"')
            # select the id with fzf and then checkout
            selected=$(echo -e "${all_issues_without_pr_linked}\n${all_prs}" | fzf | awk '{print $1}')
            id=${selected}
            # if id is not empty and is a pr
            is_id_a_pr=$(gh pr list | grep "${id}")
            if [ -n "${id}" ]; then
                if [ -n "${is_id_a_pr}" ]; then
                    # If the ID is a PR, checkout the PR branch
                    gh pr checkout "${id}"
                else
                    git checkout -b "issue-${id}"
                fi
            fi
        )
    isco: |-
        !(
            # list the issue and, create a branch to start working on it
            id=$(gh issue list | fzf | awk '{print $1}')
            if [ -n "${id}" ]; then
                git checkout -b "issue-${id}"
            else
                echo "No issue selected or error occurred"
            fi
        )
    pro: |-
        !(
             gh prco
        )
    prco: |-
        !(
            gh pr checkout \
                $(
                    GH_FORCE_TTY='50%' \
                    gh pr list \
                        | fzf \
                            --ansi --header-lines 3 \
                            --preview 'GH_FORCE_TTY=$FZF_PREVIEW_COLUMNS gh pr view {1}; GH_FORCE_TTY=$FZF_PREVIEW_COLUMNS gh pr checks {1}' \
                        | awk '{print $1}'
                )
        )
    prcr: pr create
    prcrd: |-
        !(
            # Remove next line when https://github.com/cli/cli/issues/1718 is fixed
            git push -u origin HEAD
            gh prcr \
                --fill\
                --draft
        )
    prcrb: |-
        !(
            gh __prcr
        )
    __prcr: "!(\n    branch_name=$(gh __branch-name)\n    title=$(echo ${branch_name} | tr '-' ' ')\n    \n    pr_title=\"${1:-${title}}\"\n    pr_body=\"${2:-${title}}\"\n    \n    # TODO: Remove next line when https://github.com/cli/cli/issues/1718 is fixed\n    git push -u origin HEAD\n    gh prcr --title \"${pr_title}\" --body \"${pr_body}\"\n)"
    prcrewi: prcrwi
    prcrwi: |-
        !(
            if [[ "$(git remote get-url origin)" != *github.com* ]]; then
                gh prcrwim-lunik "$@"
            else
                gh common-prcrwi
            fi
        )
    prcrwim-lunik: |-
        !(
             if [ $# -eq 0 ]; then
                 gh lunik-prcrwi
             else
                 gh lunik-prcrwim "$1"
             fi
         )
    prcrwim-plain: |-
        !(
            if [ $# -eq 0 ]; then
                gh plain-prcrwi
            else
                gh plain-prcrwim "$1"
            fi
        )
    prcrwir: |-
        !(
            gh prcrwi
            gh pr ready
        )
    prci: pr checks
    approve: pr review --approve
    ok: approve
    lgtm: pr review --approve --body "LGTM. Approved from gh cli"
    pr-approve: |-
        !(
            pr_id=""
            [ $# -eq 1 ] && pr_id=$1
            [ -z "${pr_id}" ] && pr_id=$(gh pr list | fzf | awk '{print $1}')
            gh pr-approve-id "${pr_id}"
        )
    pr-approve-last: |-
        !(
            pr_id=$(gh pr list | head -n1 | awk '{print $1}')
            gh pr-approve-id "${pr_id}"
        )
    pr-approve-id: |-
        !(
            if [ $# -ne 1 ]; then
                echo "Usage: gh pr-approve-id [pr_id|branch_name|pr_url]"
                exit 1
            fi
            pr="$1"
            gh pr review \
                ${pr} \
                --approve \
                --body "approved from gh cli"
        )
    merge: |-
        !(
            gh __pr-merge
        )
    codespaces: codespace list
    configs: config list
    renewup: "!(\n    folder_name=$(basename $(pwd))\n    repo_name=${folder_name}\n    \n    repo_owner=$(git remote get-url origin 2>/dev/null | sed -n 's/.*github.com[:\\/]\\([^/]*\\)\\/.*/\\1/p')\n    owner_name=${GH_DEFAULT_OWNER:-${repo_owner}}\n\n    if [ -z \"${owner_name}\" ]; then\n        owner_name=$(gh api user -q .login 2>/dev/null || true)\n    fi\n\n    is_git_new=false\n\n    if [ $# -eq 1 ]; then\n        owner_name=$1\n    fi\n    if [ $# -gt 1 ]; then\n        echo \"Usage: gh renewup [owner_name]\"\n        exit 1\n    fi\n    if [ -z \"${owner_name}\" ]; then\n        echo \"Unable to determine owner_name automatically. Pass it explicitly or set GH_DEFAULT_OWNER.\"\n        exit 1\n    fi\n\n    if [ ! -d .git ]; then\n        git init\n        is_git_new=true\n    fi\n\n    gh repo create \\\n        ${repo_name} \\\n        --private \\\n        --source=. \\\n        --remote=upstream\n\n    if [ \"${is_git_new}\" = true ]; then\n        git add .\n        git commit -m \"first commit\"\n    fi\n\n    # TODO: Change to other github server\n    git remote add origin git@github.com:${owner_name}/${repo_name}.git\n\n    git push -u origin main\n)"
    rc: repo clone
    clo: repo clone "$1"/"$2"
    repos: repo list
    repos-name-all: |-
        !(
            user=${1:-$USER}
            gh api --paginate graphql -f owner="${user}" -f query='
                query($owner: String!, $per_page: Int = 100, $endCursor: String) {
                    repositoryOwner(login: $owner) {
                        repositories(first: $per_page, after: $endCursor, ownerAffiliations: OWNER) {
                            nodes { name }
                            pageInfo { hasNextPage endCursor }
                        }
                    }
                }
            ' | jq -r '.data.repositoryOwner.repositories.nodes[].name' | sort
        )
    alerts: |-
        !(
            gh repo-dependabot-alerts
        )
    repo-dependabot-alerts: |-
        !(
            user=${1:-$USER}
            repo=${2:-$REPO}
            gh api --paginate graphql -f owner="${user}" -f name="${repo}" -f query='
                query($owner: String!, $name: String!, $per_page: Int = 100, $endCursor: String) {
                    repository(owner: $owner, name: $name) {
                        vulnerabilityAlerts(first: $per_page, after: $endCursor) {
                            nodes {
                                createdAt
                                dismissedAt
                                securityVulnerability {
                                    package {
                                        name
                                    }
                                    advisory {
                                        description
                                    }
                                }
                            }
                            pageInfo { hasNextPage endCursor }
                        }
                    }
                }
            '
        )
    repos-name: |-
        !(
            user=${1:-$USER}
            gh repo list "${user}" --limit 9999 --json "name" --jq ".[].name"
        )
    # https://github.com/matt-bartel/gh-clone-org
    clo-org: clone-org
    clone-repos-all: |-
        !(
            user=${1:-$USER}
            gh repos-name-all "${user}" | xargs -I '%' gh repo clone ${user}/%
        )
    clone-all-repos: |-
        !(
            user=${1:-$USER}
            gh clone-repos-all ${user}
        )
    issues: issue list
    releases: release list
    runs: run list
    runs-branch: |-
        !(
            gh run list --branch=$(git branch --show)
        )
    exec-watch-workflow-branch: |-
        !(
            if [ $# -lt 1 ]; then
                echo "Usage: gh exec-watch-workflow-branch <workflow_filerelpath> [workflow_args]"
                exit 1
            fi
            gh execute-workflow-branch $@
            sleep 10 # wait for the workflow to start
            gh watch-last-run-execution
        )
    execute-workflow-branch: |-
        !(
            if [ $# -lt 1 ]; then
                echo "Usage: gh execute-workflow-branch <workflow_filerelpath> [workflow_args]"
                exit 1
            fi
            workflow_filepath="$(git rev-parse --show-toplevel)/$1"; shift
            if [ -z "${workflow_filepath}" ]; then
                echo "<workflow_filerelpath> is required"
                exit 1
            fi
            workflow_args="$@"
            workflow_name_to_run=$(yq '.name' ${workflow_filepath})
            branch_name=$(gh __branch-name)
            gh workflow run "${workflow_name_to_run}" --ref "${branch_name}" ${workflow_args}
        )
    watch-last-run-execution: |-
        !(
            last_run_id=$(gh __get-last-run-execution-id)
            gh run watch ${last_run_id}
            if [ $? -eq 0 ]; then
                gh run view --log ${last_run_id}
            fi
        )
    view-last-run-execution: |-
        !(
            last_run_id=$(gh __get-last-run-execution-id)
            gh run view ${last_run_id}
        )
    secrets: secret list
    ssh-keys: ssh-key list
    workflows: workflow list
    list-milestones: |-
        api graphql -F owner=':owner' -F name=':repo' -f query='
            query ListMilestones($name: String!, $owner: String!) {
                repository(owner: $owner, name: $name) {
                    milestones(first: 100) {
                        nodes {
                            title
                            number
                            description
                            dueOn
                            url
                            state
                            closed
                            closedAt
                            updatedAt
                        }
                    }
                }
            }
        '
    lm: |-
        !(
            gh list-milestones | jq '.data.repository.milestones.nodes[]'
        )
    rate-limit: |-
        !(
            gh api \
                -H "Accept: application/vnd.github.v3+json" \
                /rate_limit
        )
    rate-limit-table: |-
        !(
            gh api \
                -H "Accept: application/vnd.github.v3+json" \
                /rate_limit \
            | jq '.resources' \
            | jq -r '(["LIMIT","USED","REMAINING","RESET"] | (., map(length*"-"))), (.[] | [.limit, .used, .remaining, (.reset | todate)]) | @tsv'
        )
    rate-limit-table-new: |-
        !(
            gh api \
                -H "Accept: application/vnd.github.v3+json" \
                /rate_limit \
            | jq -r '(["id", "limit", "used", "remaining", "reset"] | (., map(length*"-"))), (.resources | to_entries[] | [.key, .value.limit, .value.used, .value.remaining, (.value.reset | todate)]) | @tsv'
        )
    ####
    # Tools
    ####
    # Jira
    jira-wi: |-
        !(
            wi_id="$1"
            gh jira-new-branch ${wi_id}
        )
    jira-new-branch: |-
        !(
            wi_id="$1"
            gh new-branch-from-jira-wi ${wi_id}
        )
    jira-wif: "!(\n    # List active Jira work items assigned to current user (or all not-done if none assigned),\n    # show a preview of the description, and create a branch from the selected issue.\n    if ! command -v \"jira\" &> /dev/null; then\n        echo \"jira cli not found, please install https://github.com/ankitpokhrel/jira-cli\"\n        exit 1\n    fi\n\n    # JQL to prefer issues assigned to current user, falling back to any not-done issue.\n    JQL_ASSIGNED='assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC'\n    JQL_ANY='statusCategory != Done ORDER BY updated DESC'\n\n    # Try to get JSON output first; fallback to plain list if --output isn't supported.\n    issues_json=\"\"\n    issues_json=$(jira issue list --jql \"$JQL_ASSIGNED\" --output json 2>/dev/null) || true\n    if [ -z \"$issues_json\" ]; then\n        issues_json=$(jira issue list --jql \"$JQL_ASSIGNED\" 2>/dev/null) || true\n    fi\n    if [ -z \"$issues_json\" ]; then\n        # try any not-done issues\n        issues_json=$(jira issue list --jql \"$JQL_ANY\" --output json 2>/dev/null) || true\n        if [ -z \"$issues_json\" ]; then\n            issues_json=$(jira issue list --jql \"$JQL_ANY\" 2>/dev/null) || true\n        fi\n    fi\n\n    if [ -z \"$issues_json\" ]; then\n        echo \"No Jira issues found for the queries.\"\n        exit 0\n    fi\n\n    # Parse JSON batches that may use either {\"issues\": [...]} or a top-level array.\n    echo \"$issues_json\" \\\n        | jq -r '\n            if type == \"object\" and has(\"issues\") then .issues[]\n            else .[]\n            end\n          | [.key, .fields.summary, (.fields.status.name // .fields.status // \"-\"), (.fields.assignee.displayName // \"Unassigned\")] | @tsv'\n    \n    # Pipe to fzf with preview, then create branch from chosen issue key.\n    echo \"$issues_json\" \\\n        | jq -r '\n            if type == \"object\" and has(\"issues\") then .issues[]\n            else .[]\n            end\n          | [.key, .fields.summary, (.fields.status.name // .fields.status // \"-\"), (.fields.assignee.displayName // \"Unassigned\")] | @tsv' \\\n        | fzf --delimiter $'\\t' \\\n            --preview \"jira issue get {1} --output json 2>/dev/null | jq -r '.fields.description // .renderedFields.description // \"(no description)\"' | w3m -dump -T text/html\" \\\n        | awk '{print $1}' \\\n        | xargs -r -I '%' gh plain-new-branch '%'\n)"
    new-branch-from-jira-wi: "!(\n    if [ $# -ne 1 ]; then\n        echo \"Usage: gh new-branch-from-jira-wi <wi_id>\"\n        exit 1\n    fi\n    \n    wi_id=\"$1\"\n\n    wi_project=$(echo \"${wi_id}\" | awk -F'-' '{print $1}')\n    \n    wi_title=\"$(gh jira-item-title \"${wi_id}\")\"\n    if [ -z \"${wi_title}\" ]; then\n        echo \"Error: Work item not found\"\n        exit 1\n    fi\n  \n    gh new-branch-wi-jira \"${wi_project}\" \"${wi_id}\" \"${wi_title}\"\n)"
    new-branch-wi-jira: "!(\n    if [ $# -ne 3 ]; then\n        echo \"Usage: gh new-branch-wi-jira <wi_project> <wi_id> <wi_title>\"\n        exit 1\n    fi\n    \n    wi_project=\"$1\"\n    wi_id=\"$2\"\n    wi_title=\"$3\"\n    \n    git sw -c \"${wi_project}-${wi_id}_${wi_title}\"\n)"
    jira-item-title: "!(\n    if [ $# -ne 1 ]; then\n        echo \"Usage: gh jira-item-title <wi_id>\"\n        exit 1\n    fi\n    wi_id=\"$1\"\n    \n    # if jira cli not installed install it\n    if ! command -v \"jira\" &> /dev/null; then\n        echo \"jira cli not found, installing it\"\n        exit 1\n    fi\n    jira issue get \"${wi_id}\" --fields summary | jq -r '.fields.summary'\n)"
    # Azure DevOps
    new-branch-azdo: "!(\n    if [ $# -ne 2 ]; then\n        echo \"Usage: gh new-branch-azdo <wi_id> <wi_title>\"\n        exit 1\n    fi\n    \n    wi_id=\"$1\"\n    wi_title=\"$2\"\n    \n    git sw -c \"AB-${wi_id}_${wi_title}\"\n)"
    new-branch-from-azdo-wi: "!(\n    if [ $# -ne 1 ]; then\n        echo \"Usage: gh new-branch-from-azdo-wi <wi_id>\"\n        exit 1\n    fi\n    \n    wi_id=\"$1\"\n    \n    wi_title=\"$(gh azdo-item-title \"${wi_id}\")\"\n    if [ -z \"${wi_title}\" ]; then\n        echo \"Error: Work item not found\"\n        exit 1\n    fi\n                \n    gh new-branch-azdo \"${wi_id}\" \"${wi_title}\"\n)"
    azdo-wif-simple: |-
        !(
            gh azdo-get-active-wi-info \
            | fzf --delimiter '\t' \
            | awk '{print $1}' \
            | xargs -I '%' gh plain-new-branch '%'
        )
    azdo-wif-prev: |-
        !(
            gh azdo-get-active-wi-info \
            | fzf --delimiter '\t' \
                --preview "az boards work-item show --id {1} --output json | jq -r '.fields.\"System.Description\"  ' | w3m -dump -T text/html" \
            | awk '{print $1}' \
            | xargs -I '%' gh plain-new-branch '%'
        )
    # TODO: remove this, duplicated into bash_aliases, use bash commands intead of run gh commands for all. Create branches better from bash aliases and with the branch name, take the info for the next commands.
    azdo-item-title: "!(\n    if [ $# -ne 1 ]; then\n        echo \"Usage: gh azdo-item-title <wi_id>\"\n        exit 1\n    fi\n    wi_id=\"$1\"\n    \n    if ! command -v \"az\" &> /dev/null; then\n        echo \"az cli not found, installing it\"\n        exit 1\n    fi\n    \n    # cehck az boards extension\n    if ! az extension show --name boards &> /dev/null; then\n        echo \"az boards extension not found, installing it\"\n        exit 1\n    fi\n    \n    az boards work-item show \\\n        --id \"${wi_id}\" \\\n        --output json \\\n        --query 'fields.\"System.Title\"' \\\n        | tr '[:upper:]' '[:lower:]' \\\n        | tr -d '!\"#$%&'\"'\"'()*+,./:;<=>?@[\\\\]^_`{|}~-' \\\n        | sed -e 's/[ \\t]*$//' \\\n        | tr ' ' '-'\n)"
    azdo-get-active-wi-ids: |-
        !(
            az boards query  \
                --wiql "SELECT [System.Id] FROM workitems WHERE [System.WorkItemType] = 'User Story' AND ([System.State] = 'ToDo' OR [System.State] = 'Active')" \
                --query "[*].id" \
                --output tsv
        )
    azdo-get-active-wi-info: |-
        !(
            gh azdo-get-active-wi-ids \
            | xargs --max-procs 8 -I '%' sh -c \
                "az boards work-item show --id '%' --output json | jq -r '.fields | {id: .\"System.Id\"  , title: .\"System.Title\"  , state: .\"System.State\"  , assigned: .\"System.AssignedTo.displayName\"   } | [.id, .title, .state, .assigned] | @tsv'"
        )
    ####
    # Company
    ####
    # common
    common-prcrwi: |-
        !(
            branch_name=$(gh __branch-name)
            wi_id=$(echo ${branch_name} | awk -F'_' '{print $1}')
            wi_title=$(echo ${branch_name} | awk -F'_' '{print $2}')

            wi_id_gh=$(echo ${wi_id} | tr '-' '#')
            wi_id=$(echo ${wi_id_gh} | awk -F'#' '{print $2}')
            wi_title=$(echo ${wi_title} | tr '-' ' ')

            pr_title="${wi_id_gh} ${wi_title}"

            pr_body="${wi_id_gh}"

            # TODO: Remove next line when https://github.com/cli/cli/issues/1718 is fixed
            git push -u origin HEAD

            bash -c "gh prcr \
                --title \"${pr_title}\" \
                --body-file \"${pr_body}\" \
                --draft"
        )
    # lunik
    lunik-prcrwi: "!(\n    # Usage: gh lunik-prcrwi\n    \n    branch_name=$(gh __branch-name)\n\n    issue_id=$(echo \"${branch_name}\" | awk -F'_' '{print $1}')\n    branch_issue_title=$(echo \"${branch_name}\" | awk -F'_' '{print $2}')\n    \n    wi_id=\"${issue_id}\"            \n    wi_title=$(echo \"${branch_issue_title}\" | tr '-' ' ')\n\n    git push -u origin HEAD\n    \n    pr_body_temp_file=$(mktemp -t pr_body_XXXXX.md)\n    chmod 666 ${pr_body_temp_file}\n    trap \"rm -f ${pr_body_temp_file}\" EXIT\n\n    echo \"# Description\" >> ${pr_body_temp_file}\n    echo -e \"\\n${wi_title}\" >> ${pr_body_temp_file}\n    echo -e \"\\nJira Issue: ${wi_id}\" >> ${pr_body_temp_file}\n\n    bash -c \"gh prcr \\\n        --body-file \\\"${pr_body_temp_file}\\\" \\\n        --fill \\\n        --draft\"\n)"
    # plain
    plain-wi: |-
        !(
            wi_id="$1"
            gh plain-new-branch ${wi_id}
        )
    plain-new-branch: |-
        !(
            wi_id="$1"
            gh new-branch-from-azdo-wi ${wi_id}
        )
    plain-prcrwim: "!(\n    # Usage: gh plain-prcrwim [pr_title]\n\n    branch_name=$(gh __branch-name)\n    \n    issue_id=$(echo \"${branch_name}\" | awk -F'_' '{print $1}')\n    branch_issue_title=$(echo \"${branch_name}\" | awk -F'_' '{print $2}')\n    \n    wi_id=\"${issue_id}\"\n    # if the issue id is in the format of AB-1234, then remove the prefix\n    case \"${wi_id}\" in\n        AB-*) \n            wi_id_azdo=\"${wi_id#AB-}\" # remove the prefix\n            pr_body='#'\"${wi_id_azdo}\"\n            ;;\n        *)\n            wi_id_azdo=${wi_id}\n            pr_body=\"${wi_id_azdo}\"\n            ;;\n    esac\n    \n    wi_title=\"${branch_issue_title}\"\n    wi_title_azdo=$(echo \"${wi_title}\" | tr '-' ' ')\n    \n    pr_title=\"${wi_id_azdo} ${wi_title_azdo}\"\n    \n    default_branch=\"main\"\n    default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')\n\n    git push -u origin HEAD\n    \n    az repos pr create \\\n        --title \"${pr_title}\" \\\n        --description \"${pr_body}\" \\\n        --source-branch \"${branch_name}\" \\\n        --target-branch \"${default_branch}\" \\\n        --work-items \"${wi_id_azdo}\"\n)"
    plain-prcrwi: "!(\n    set -x\n    # Usage: gh plain-prcrwi\n    \n    branch_name=$(gh __branch-name)\n\n    issue_id=$(echo \"${branch_name}\" | awk -F'_' '{print $1}')\n    branch_issue_title=$(echo \"${branch_name}\" | awk -F'_' '{print $2}')\n    \n    wi_id=\"${issue_id}\"\n    if [[ \"${issue_id}\" == \"AB-\"* ]]; then\n        wi_id_azdo=\"${wi_id#AB-}\" # remove the prefix\n        pr_body='#'\"${wi_id_azdo}\"\n    else\n        wi_id_azdo=${wi_id}\n        pr_body=\"${wi_id_azdo}\"\n    fi\n    \n    wi_title=\"${branch_issue_title}\"\n    wi_title_azdo=$(echo \"${wi_title}\" | tr '-' ' ')\n    \n    pr_title=\"${wi_id_azdo} ${wi_title_azdo}\"\n    \n    default_branch=\"main\"\n    if command -v \"git default-branch\" &> /dev/null; then\n        default_branch=$(git default-branch)\n    else\n        default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')\n    fi\n\n    git push -u origin HEAD\n    \n    az repos pr create \\\n        --title \"${pr_title}\" \\\n        --description \"${pr_body}\" \\\n        --source-branch \"${branch_name}\" \\\n        --target-branch \"${default_branch}\" \\\n        --work-items \"${wi_id_azdo}\"\n)"
    # pezaio
    pezaio-wi: |-
        !(
            wi_id="$1"
            gh pezaio-new-branch ${wi_id}
        )
    pezaio-new-branch: |-
        !(
            wi_id="$1"
            gh new-branch-from-azdo-wi ${wi_id}
        )
    pezaio-wif: |-
        !(
            project=PaymentPlatform
            IterationPath="${project}\Sprint $(date +%Y-%V)"
            azdo_web="https://dev.azure.com/pezaio"
            az boards query --org ${azdo_web} --project ${project} \
                --wiql "SELECT [System.Id] FROM workitems WHERE [System.WorkItemType] = 'User Story' AND ([System.State] = 'ToDo' OR [System.State] = 'Active') AND [System.IterationPath] = \"${IterationPath}\""  \
                --query "[*].{id:id,url:url}" \
                --output json \
            | jq -r '.[].id' \
            | fzf --preview 'az boards work-item show --id {1} --org https://dev.azure.com/pezaio --output table'
        )
    pezaio-prcrwi: "!(\n    root_dir=$(git rev-parse --show-toplevel)\n    branch_name=$(gh __branch-name)\n    wi_id=$(echo ${branch_name} | awk -F'_' '{print $1}')\n    wi_title=$(echo ${branch_name} | awk -F'_' '{print $2}')\n\n    wi_id_azdo_gh=$(echo ${wi_id} | tr '-' '#')\n    wi_id_azdo=$(echo ${wi_id_azdo_gh} | awk -F'#' '{print $2}')\n    wi_title_azdo=$(echo ${wi_title} | tr '-' ' ')\n\n    pr_title=\"${wi_id_azdo_gh} ${wi_title_azdo}\"\n\n    # if there is pull_request_template.md file in the .github folder, use it as pr body\n    # pr_tmpl=${root_dir}/.github/pull_request_template.md\n    # Force not enter\n    pr_tmpl=${root_dir}/.github/pull_request_template.md\n    pr_body_temp_file=$(mktemp -t pr_body_XXXXX.md)\n    chmod 666 ${pr_body_temp_file}\n    #trap \"rm -f ${pr_body_temp_file}\\\" EXIT\n\n    if [ -f \"${pr_tmpl}\" ]; then\n        # Modify the template using sed\n        modified_template=$(cat \"${pr_tmpl}\")\n        modified_template=$(echo \"${modified_template}\" | sed '/<!--/,/-->/d')\n        modified_template=$(echo \"${modified_template}\" | sed \"s@### User Stories/Bugs affected@### User Stories/Bugs affected\\\\n\\\\nRelated ${wi_id_azdo_gh}@\")\n        modified_template=$(echo \"${modified_template}\" | sed 's@### Other systems impacted@### Other systems impacted\\\\n\\\\n- N/A@')\n        modified_template=$(echo \"${modified_template}\" | sed 's@- \\\\[ \\\\] No@- [x] No@')\n        # Remplace double empty lines with one empty line\n        modified_template=$(echo \"${modified_template}\" | sed ':L;N;s/^\\\\\\\\n$//;t L')\n        echo \"${modified_template}\" > ${pr_body_temp_file}\n        \n        pr_body=\"${pr_body_temp_file}\"\n    else\n        pr_body=\"${wi_id_azdo_gh}\n    fi\n\n    # TODO: Remove next line when https://github.com/cli/cli/issues/1718 is fixed\n    git push -u origin HEAD\n\n    bash -c \"gh prcr \\\n        --title \\\"${pr_title}\\\" \\\n        --body-file \\\"${pr_body}\\\" \\\n        --draft\"\n)"
    pezaio-dependabot-merge: |-
        !(
            git stash
            gh approve
            gh pr merge \
                --auto \
                --squash \
                --delete-branch
            git stash pop
        )
    ####
    # typos
    ####
    lsit: list
    ####
    # private
    ####
    __branch-name: |-
        !(
            git rev-parse --abbrev-ref HEAD
        )
    __pr-merge: |-
        !(
            branch_name=$(gh __branch-name)
            gh pr merge \
                ${branch_name} \
                --auto \
                --squash \
                --delete-branch
        )
    __get-last-run-execution-id: |-
        !(
            gh run list --limit 1 --json "databaseId" --jq ".[0].databaseId"
        )
# The path to a unix socket through which send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
